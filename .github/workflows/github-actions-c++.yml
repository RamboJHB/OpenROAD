name: Test C++20 Compile
on:
  # Triggers the workflow on push or pull request events
  push:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openroad/ubuntu-cpp20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Install C++20-compatible LEMON
        run: |
          set -euo pipefail
          git clone --depth=1 -b 1.3.1 \
            https://github.com/The-OpenROAD-Project/lemon-graph.git /tmp/lemon-graph
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local -B /tmp/lemon-graph/build /tmp/lemon-graph
          cmake --build /tmp/lemon-graph/build -j"$(nproc)" --target install
      - name: Build OpenROAD
        run: |
          ./etc/Build.sh -compiler='clang-16' -cmake='-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=20'
