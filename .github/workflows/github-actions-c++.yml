name: Test C++20 Compile
on:
  # Triggers the workflow on push or pull request events
  push:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openroad/ubuntu-cpp20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Patch LEMON for C++20 compatibility
        run: |
          if ! grep -q "AllocatorTraits" /usr/local/include/lemon/bits/array_map.h; then
            patch -p1 -d /usr/local/include < third-party/lemon/patches/allocator-patch.patch
          fi
      - name: Build OpenROAD
        run: |
          ./etc/Build.sh -compiler='clang-16' -cmake='-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=20'
